name: CI/CD backend pipeline (v1)

on:
  push:
    branches:
      - master

env:
  NODE_VERSION: 24
  DOCKER_IMAGE_REPOSITORY_NAME: fercdevv/backend-sonar-node-api:latest

jobs:
  build-and-test:
    runs-on: ubuntun-latest

    steps:
      - name: Checkout de codigo
        uses: actions/checkout@v7
      
      - name: Setup Nodejs Version
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION}}
      
      - name: Install dependencies
        run: npm install

      - name: Ejecutar unit tests
        run: npm test

  docker-build-push:
    runs-on: ubuntun-latest
    needs: build-and-test

    steps:
      - name: Checkout de codigo
        uses: actions/checkout@v7
      
      - name: Conectar con DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        
      - name: Build docker image and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tag: ${{ env.DOCKER_IMAGE_REPOSITORY_NAME }}